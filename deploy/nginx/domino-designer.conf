# Place in /etc/nginx/sites-available/ on the nginx LXC and symlink into
# sites-enabled/, or drop into conf.d/. Adjust server_name, cert paths, and
# the upstream IP/port to match your setup.
#
# Upstream: the Docker host's LAN IP and the port published in docker-compose.yml
# (APP_BIND_ADDRESS:4000 in .env). Replace 192.168.1.50 below with that value.

upstream domino_designer {
    server 192.168.1.50:4000;
}

server {
    listen 80;
    listen [::]:80;
    server_name domino.example.com;

    # Redirect all plain HTTP to HTTPS once you have a certificate installed.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domino.example.com;

    ssl_certificate     /etc/letsencrypt/live/domino.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domino.example.com/privkey.pem;

    # Image uploads are capped at 10MB app-side; give nginx a little headroom.
    client_max_body_size 12m;

    location / {
        proxy_pass http://domino_designer;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Required: the app trusts X-Forwarded-Proto to decide whether to mark
        # session cookies Secure and to build correct redirect URLs.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
