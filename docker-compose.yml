services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-domino}
    volumes:
      - domino-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domino} -d ${POSTGRES_DB:-domino}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-domino}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-domino}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
    # Published so the nginx LXC (a separate host on your LAN) can reach this
    # container. Bind to a specific LAN-facing IP on the Docker host, not 0.0.0.0,
    # so it isn't reachable from outside your LAN. Set APP_BIND_ADDRESS in .env,
    # e.g. APP_BIND_ADDRESS=192.168.1.50 (see README).
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:4000:4000"

volumes:
  domino-db-data:
