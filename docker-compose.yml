services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-domino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-domino}
    volumes:
      - domino-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-domino} -d ${POSTGRES_DB:-domino}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Pinned explicitly (rather than left to Compose's directory-name-derived
    # default) because rebuild.sh builds this image directly with `docker
    # buildx build -t domino-designer-app`, bypassing `docker compose build`
    # entirely — Compose's own buildx auto-detection has proven unreliable on
    # some hosts, silently falling back to the legacy builder, which can't
    # handle the Dockerfile's BuildKit-only `RUN --mount=type=cache` syntax.
    image: domino-designer-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # Passed as separate fields (not a pre-built DATABASE_URL) because
      # POSTGRES_PASSWORD may contain characters like @, :, /, or % that are
      # reserved in a URL; docker-entrypoint.sh percent-encodes them before
      # assembling the real connection string.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-domino}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-domino}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}
    # Published on all interfaces: reachable from other LAN machines (nginx LXC,
    # etc.) and from a Cloudflare Tunnel / cloudflared process, however you point
    # them at it. Session cookies use `secure: 'auto'` server-side, so login works
    # whether a given request arrives over plain HTTP or HTTPS.
    ports:
      - "4000:4000"

volumes:
  domino-db-data:
